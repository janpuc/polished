openapi: 3.1.0
info:
  title: Polished API
  version: '1'
  summary: The server contract of the Polished native app
  description: |
    The JSON API of the Polished iPhone and iPad app (docs/NATIVE.md section 3). Generated from the
    server's response models by `scripts/make_api_spec.py`; `fixtures/` holds recorded responses.

    * `Authorization: Bearer <token>` is the only credential under `/api/v1` (cookies are ignored).
      A missing, unknown or revoked token is a 401 with the error body, never a redirect.
    * Every GET answers `ETag` and honours `If-None-Match` (304, empty body); `Cache-Control: private,
      no-cache`. Every answer carries `X-Polished-Api: 1`.
    * Errors are `{"error": {"code", "message", "field"?}}`. Ids are opaque integers, money is cents,
      dates are `YYYY-MM-DD`, timestamps are UTC (`…Z`).
    * Additive changes (new optional fields, new endpoints) stay in v1; a breaking change is `/api/v2`.
paths:
  /auth/app/start:
    get:
      summary: Start the app's sign-in (in a browser session)
      description: |-
        The native app opens this in ASWebAuthenticationSession (docs/NATIVE.md 2.4): remember its
        PKCE challenge in the web session, then sign in as usual and come back to /auth/app/finish.
        One sign-in is pending at a time: a second start replaces the first.
      operationId: app_start
      parameters:
      - name: challenge
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Challenge
      - name: device
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Device
      responses:
        '302':
          description: Redirects to `/auth/login?next=/auth/app/finish`.
        '400':
          description: A page saying the sign-in cannot start or finish.
      tags:
      - auth
      security: []
  /auth/app/finish:
    get:
      summary: Finish the app's sign-in (in a browser session)
      description: 'Signed in (the gate sends everyone else to log in first): hand the app a one-time
        code.'
      operationId: app_finish
      responses:
        '302':
          description: Redirects to `https://<host of PUBLIC_URL>/auth/app/callback?code=<code>`, which
            the app claims as its `ASWebAuthenticationSession` callback.
        '400':
          description: A page saying the sign-in cannot start or finish.
      tags:
      - auth
      security: []
  /auth/app/callback:
    get:
      summary: The app's https sign-in callback (a harmless page)
      description: |-
        The address the app claims as its https callback (ASWebAuthenticationSession never loads it).
        Opened anywhere else it only says what to do: it does not read the code, mint one or
        redeem one, and nothing on it reveals anything.
      operationId: app_callback
      responses:
        '200':
          description: 'A page that says to open Polished. It never reads the `code`. `Cache-Control:
            no-store`, `X-Robots-Tag: noindex`, no referrer.'
          content:
            text/html:
              schema:
                type: string
      tags:
      - auth
      security: []
  /api/v1/auth/exchange:
    post:
      tags:
      - auth
      summary: Trade the sign-in code for a device token
      description: |-
        Public: the single-use code from `/auth/app/finish` and the PKCE verifier are the
        credential. The code is used up by the attempt, right or wrong.
      operationId: exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
        '400':
          description: '`bad_code`: expired, already used, or the wrong verifier.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`validation`, with `field` set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/v1/auth/revoke:
    post:
      tags:
      - auth
      summary: Sign out this device
      description: Revokes the token that made the call. (The development token has nothing to revoke.)
      operationId: revoke
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/devices:
    get:
