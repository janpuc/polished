          description: '`If-None-Match` matched the ETag.'
    post:
      tags:
      - lookup
      summary: Teach the app that a code is a shade
      description: |-
        A learned code is never overwritten: if `value` already points somewhere, that mapping
        stays, 200 comes back and `identifier.shade_id` says where it points.
      operationId: learn_identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierLearned'
        '200':
          description: The code was already known (`created` is false) and keeps its shade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierLearned'
        '404':
          description: '`not_found`: no such shade.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`validation`, with `field` set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/identifiers/{identifier_id}:
    delete:
      tags:
      - lookup
      summary: Forget a learned code
      description: '"This isn''t it" on a match, or Delete in the list of learned codes.'
      operationId: forget_identifier
      parameters:
      - name: identifier_id
        in: path
        required: true
        schema:
          type: integer
          title: Identifier Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: '`not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`validation`, with `field` set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sync:
    get:
      tags:
      - sync
      summary: Sync status
      operationId: sync_status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
          headers:
            ETag:
              description: A hash of the body.
              schema:
                type: string
            X-Polished-Api:
              description: Always `1`.
              schema:
                type: string
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '304':
          description: '`If-None-Match` matched the ETag.'
  /api/v1/sync/run:
    post:
      tags:
      - sync
      summary: Sync now
      description: |-
        Starts a manual run in the background and answers at once; poll `GET /sync` for the end.
        The run fetches the shop's `products.json` (three requests, one a second) and waits out the
        cooldown between manual runs.
      operationId: sync_run
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStarted'
        '409':
          description: '`sync_running`: a run is already going.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`cooldown`: the last run started too recently; see `retry_after_s`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wear/{shade_id}:
    post:
      tags:
      - home
      summary: Record that a shade was worn today
      description: |-
        Today is the household's date. Recording the same shade twice in a day is one wearing, so
        a repeated tap changes nothing.
      operationId: wear_record
      parameters:
      - name: shade_id
        in: path
        required: true
        schema:
          type: integer
          title: Shade Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worn'
        '404':
          description: '`not_found`: no such shade.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, unknown or revoked token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`validation`, with `field` set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /.well-known/apple-app-site-association:
    get:
      tags:
      - app
      summary: Universal links for the iPhone app
      description: |-
        Public, served as application/json with no redirect. Registered only when
        POLISHED_APPLE_TEAM_ID is set. `/shades/new` is excluded before `/shades/*` (first match wins).
        `applinks` has no `/auth/*` component: a tapped link never opens the sign-in callback in the
        app. The callback is claimed through `webcredentials` for ASWebAuthenticationSession alone.
      operationId: apple_app_site_association
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /__test/reset:
    post:
      tags:
      - testing
      summary: Restore the template database (UI tests only)
      operationId: test_reset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not enabled, or not called from loopback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
