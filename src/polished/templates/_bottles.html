{# The bottles of one shade: the body of #bottles on the shade page. #}
<div id="bottles" class="bottles">
  {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
  {% if bottles %}
  <section class="bottles-section">
    <h2 class="section-title">Bottles</h2>
    <div class="group">
      {% for bottle in bottles %}{% include "_bottle_card.html" %}{% endfor %}
    </div>
  </section>
  {% endif %}
</div>
