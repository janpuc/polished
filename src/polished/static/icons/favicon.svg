<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The favicon and the small header mark: the foil nail with a lighter free-edge band (strokes
       vanish at 16px), on a rounded plum tile that reads on light and dark tab bars alike. No style
       element, no media query (the CSP). -->
  <defs>
    <radialGradient id="ground" cx="50" cy="40" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a1c45"/><stop offset="1" stop-color="#180b1e"/>
    </radialGradient>
    <linearGradient id="foil" x1="22" y1="14" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fa8"/><stop offset="0.18" stop-color="#ffb347"/>
      <stop offset="0.34" stop-color="#f7f06a"/><stop offset="0.5" stop-color="#4fe8a4"/>
      <stop offset="0.66" stop-color="#3fc4ff"/><stop offset="0.82" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#ff5fa8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ground)"/>
  <path fill="url(#foil)" d="M22 42C22 25 34 14 50 14C66 14 78 25 78 42V66C78 79 66 86 50 86C34 86 22 79 22 66Z"/>
  <path fill="#fff" fill-opacity="0.32" d="M22 42C22 25 34 14 50 14C66 14 78 25 78 42C68 30 32 30 22 42Z"/>
</svg>
