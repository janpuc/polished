<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The favicon: the same nail tip without the gloss and the smile line, about 75 percent of the box, on a
       rounded plum tile that reads on light and dark tab bars alike. No style element, no media
       query (the CSP). -->
  <defs>
    <radialGradient id="ground" cx="50" cy="42" r="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#301838"/>
      <stop offset="1" stop-color="#1e1024"/>
    </radialGradient>
    <linearGradient id="foil" x1="28" y1="20" x2="72" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb3c7"/>
      <stop offset="0.25" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#b7f5c8"/>
      <stop offset="0.75" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#d3b4ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ground)"/>
  <path transform="translate(50 50) scale(1.2) translate(-50 -51)" fill="url(#foil)" d="M28 42A22 22 0 0 1 72 42C72 56 70.6 67 68.6 74.6C67 80.2 60.4 83 50 83C39.6 83 33 80.2 31.4 74.6C29.4 67 28 56 28 42Z"/>
