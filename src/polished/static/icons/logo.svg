  <path fill="#fff" fill-opacity="0.3" d="M37 64C40 59 45 57 50 57C55 57 60 59 63 64C61 68 56 70 50 70C44 70 39 68 37 64Z"/>
  <path fill="#fff" fill-opacity="0.22" d="M32 40C32 29 40 22 50 22C60 22 68 29 68 40C62 32 38 32 32 40Z"/>
  <path fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round" d="M32.5 39.5C38 32 62 32 67.5 39.5"/>
  <ellipse cx="41" cy="36" rx="10" ry="5.5" transform="rotate(-32 41 36)" fill="url(#gloss)"/>
  <path fill="#fff" fill-opacity="0.95" d="M74 22C74.7 27.5 76.5 29.3 82 30C76.5 30.7 74.7 32.5 74 38C73.3 32.5 71.5 30.7 66 30C71.5 29.3 73.3 27.5 74 22Z"/>
