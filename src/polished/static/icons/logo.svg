<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- The Polished mark: a nail painted in holographic foil, overhanging a stylised plum fingertip,
       with lunula, smile line, gloss and one sparkle (docs/VISUAL.md 10). Full-bleed square, no
       rounding: iOS masks it. No filters, no style element. scripts/make_icons.py rasterises it. -->
  <defs>
    <radialGradient id="ground" cx="50" cy="40" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a1c45"/><stop offset="1" stop-color="#180b1e"/>
    </radialGradient>
    <linearGradient id="finger" x1="0" y1="30" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86537f"/><stop offset="1" stop-color="#2a1532"/>
    </linearGradient>
    <linearGradient id="foil" x1="32" y1="22" x2="68" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fa8"/><stop offset="0.18" stop-color="#ffb347"/>
      <stop offset="0.34" stop-color="#f7f06a"/><stop offset="0.5" stop-color="#4fe8a4"/>
      <stop offset="0.66" stop-color="#3fc4ff"/><stop offset="0.82" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#ff5fa8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="68" y1="22" x2="32" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="dome" cx="50" cy="44" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#1e1024" stop-opacity="0"/><stop offset="1" stop-color="#1e1024" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#ground)"/>
  <path fill="url(#finger)" d="M22 100V58C22 41 34 30 50 30C66 30 78 41 78 58V100Z"/>
