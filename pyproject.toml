[project]
name = "polished"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.6",
  "tzdata>=2026.5",
  "segno>=1.6.6",
  "pillow>=13.0.0",
  "numpy>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polished"]

[tool.ruff]
line-length = 100
target-version = "py312"
# research/ holds one-off snapshot scripts and docs/ the appendix scripts (ruff formats the
# Python blocks of Markdown); neither is part of the app.
extend-exclude = ["spikes", "research", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
